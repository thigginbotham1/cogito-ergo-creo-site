<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cogito, Ergo Creo</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      text-align: center;
    }

    .logo-wrap {
      position: relative;
      width: 100%;
      max-width: 1815px;
      margin: 0 auto;
    }

    .logo {
      width: 100%;
      height: auto;
      display: block;
    }

    .trademark {
      position: absolute;
      right: 2.8%;
      top: 63%;
      color: #f3cf78;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(16px, 2vw, 34px);
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,.7);
    }

    .status {
      margin: 24px 0 40px;
      color: white;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="logo-wrap">
      <img
        class="logo"
        src="logo.png"
        alt="Cogito, Ergo Creo"
      >
      <span class="trademark">™</span>
    </div>

    <div class="status">In Development</div>

  </main>
</body>
</html>
