<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cogito, Ergo Creo</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 100%;
      max-width: 1600px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .status {
      margin: 24px 0 40px;
      color: white;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <main class="page">
    <img
      class="logo"
      src="logo.png"
      alt="Cogito, Ergo Creo™"
    >

    <div class="status">In Development</div>
  </main>
</body>
</html>
